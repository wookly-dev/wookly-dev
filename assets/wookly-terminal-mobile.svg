<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img" aria-labelledby="title desc">
<title id="title">WooklyDev terminal — practical Windows apps and web tools</title>
<desc id="desc">A decorative shell introduces WooklyDev and NetLoom with typed commands. It does not connect to a live system.</desc>
<style>
text { font-family: 'Cascadia Code', 'DejaVu Sans Mono', Consolas, monospace; }
.body { font-size: 22px; fill: #d7e0eb; }
.type-about { width: 172px; }
.type-products { width: 172px; }
@media (prefers-reduced-motion: no-preference) {
 .type-about { animation: type-about 20s steps(13,end) infinite; }
 .type-products { animation: type-products 20s steps(12,end) infinite; }
 .about-output { animation: about-output 20s step-end infinite; }
 .product-prompt { animation: product-prompt 20s step-end infinite; }
 .product-output { animation: product-output 20s step-end infinite; }
 .ready-prompt { animation: ready-prompt 20s step-end infinite; }
 .cursor { animation: cursor 1.2s step-end infinite; }
}
@keyframes type-about { 0%,4% {width:0} 20%,96%,100% {width:172px} }
@keyframes type-products { 0%,32% {width:0} 48%,96%,100% {width:172px} }
@keyframes about-output { 0% {opacity:0} 22%,100% {opacity:1} }
@keyframes product-prompt { 0% {opacity:0} 30%,100% {opacity:1} }
@keyframes product-output { 0% {opacity:0} 50%,100% {opacity:1} }
@keyframes ready-prompt { 0% {opacity:0} 55%,100% {opacity:1} }
@keyframes cursor { 0%,49% {opacity:1} 50%,100% {opacity:0} }
</style>
<defs>
 <clipPath id="about-clip"><rect x="30" y="251" width="172" height="32" class="type-about"/></clipPath>
 <clipPath id="products-clip"><rect x="30" y="413" width="172" height="32" class="type-products"/></clipPath>
</defs>
<rect x="1" y="1" width="598" height="608" rx="12" fill="#080b10" stroke="#293341" stroke-width="2"/>
<path d="M1 46H599" stroke="#293341"/>
<g font-size="17" fill="#9aa9ba"><text x="26" y="30"><tspan fill="#88cca3">&gt;_</tspan> wookly.dev / profile</text><text x="568" y="30" text-anchor="end">bash</text></g>
<text x="30" y="115" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#edf2f8">WooklyDev</text>
<text x="32" y="152" font-size="20" fill="#9aa9ba">Practical software.</text>
<text x="32" y="181" font-size="20" fill="#9aa9ba">Better workflows.</text>
<g transform="translate(475 80) scale(.8)"><g fill="#5377ce"><path d="M12 18H28L40 58L51 31L59 51L47 78H31Z"/><path d="M48 18H64L78 58L90 18H106L87 78H71Z"/><path d="M48 18H64L70 35H54Z" fill="#edbd48"/></g></g>
<g class="body">
 <text x="40" y="236" class=""><tspan fill="#8aa8ed">wookly</tspan><tspan fill="#9aa9ba">@github</tspan><tspan fill="#edbd48">:~</tspan><tspan fill="#88cca3">$</tspan></text>
 <text x="30" y="275" clip-path="url(#about-clip)">cat about.txt</text>
 <g class="about-output"><text x="30" y="315" fill="#9aa9ba">Windows apps + web tools.</text><text x="30" y="347" fill="#8aa8ed">wookly.dev</text></g>
 <g class="product-prompt"><text x="40" y="398" class=""><tspan fill="#8aa8ed">wookly</tspan><tspan fill="#9aa9ba">@github</tspan><tspan fill="#edbd48">:~</tspan><tspan fill="#88cca3">$</tspan></text><text x="30" y="437" clip-path="url(#products-clip)">ls products/</text></g>
 <g class="product-output"><text x="30" y="477" fill="#edbd48">NetLoom/</text><text x="30" y="509" fill="#9aa9ba">IPv4 audit + 2D/3D topology</text></g>
 <g class="ready-prompt"><text x="40" y="572" class=""><tspan fill="#8aa8ed">wookly</tspan><tspan fill="#9aa9ba">@github</tspan><tspan fill="#edbd48">:~</tspan><tspan fill="#88cca3">$</tspan></text><rect x="278" y="553" width="12" height="23" fill="#88cca3" class="cursor"/></g>
</g>
</svg>
